<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מלון בוטיק בית חזין | אומן | Beit Chazin Boutique Hotel Uman</title>
    <!-- Font Awesome for Official Icons including Facebook & WhatsApp -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&family=Cinzel:wght@500;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --royal-blue: #0A1931;
            --deep-blue: #152B52;
            --accent-blue: #185ADB;
            --neon-blue: #00d2ff;
            --gold-primary: #D4AF37;
            --gold-light: #F3E5AB;
            --gold-dark: #AA7C11;
            --dark-bg: #090C10;
            --card-bg: #111622;
            --text-light: #F5F7FA;
            --text-muted: #A0AEC0;
            --border-color: rgba(212, 175, 55, 0.25);
            --font-he: 'Assistant', sans-serif;
            --font-en: 'Cinzel', serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-he);
            background-color: var(--dark-bg);
            color: var(--text-light);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Damask Pattern Texture Overlay */
        .damask-bg {
            background-color: #0b1329;
            background-image: radial-gradient(rgba(212, 175, 55, 0.08) 1px, transparent 0), radial-gradient(rgba(24, 90, 219, 0.15) 1px, #0b1329 1px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
        }

        /* Header & Navigation */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(9, 12, 16, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        /* Glowing Neon LED Sign effect from Image */
        .glowing-logo {
            font-family: var(--font-en);
            font-weight: 800;
            font-size: 1.6rem;
            color: #ffffff;
            text-shadow: 0 0 5px #00d2ff, 0 0 10px #00d2ff, 0 0 20px #185ADB, 0 0 30px #185ADB;
            letter-spacing: 1px;
            line-height: 1.1;
        }

        .glowing-logo span {
            display: block;
            font-size: 0.65rem;
            color: var(--gold-light);
            text-shadow: 0 0 5px var(--gold-primary);
            letter-spacing: 2px;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-lang {
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid var(--gold-primary);
            color: var(--gold-light);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.3s;
        }

        .btn-lang:hover {
            background: var(--gold-primary);
            color: var(--dark-bg);
        }

        .fb-nav-btn {
            background: #1877F2;
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(24, 119, 242, 0.3);
        }

        .fb-nav-btn:hover {
            background: #145dbf;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(24, 119, 242, 0.5);
        }
